<div class="auth-container">
  <div class="auth-card">
    <h2>Sign in</h2>
    <p class="subtitle">Enter your email and password to access your account</p>
    
    <form (ngSubmit)="onSubmit()">

        <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="formData.email"
        name="email"
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="formData.password"
        name="password"
      />
    </div>
    
    <div style="text-align: right; margin-bottom: 10px;">
        <a routerLink="/forgot-password" class="forgot-password">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-submit">
      Login
    </button>
      
    </form>
    
    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
      <p class="terms">By signing in, you agree to our Terms of Service and Privacy Policy.</p>
    </div>
  </div>
</div>
